name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # on-demand test build (artifacts only, no publish)

permissions:
  contents: write          # needed to publish GitHub Releases

jobs:
  # Build the OS matrix dynamically. Windows is gated until it passes manual
  # acceptance testing, so tag-triggered PUBLISHES (v* tags) build macOS only,
  # while workflow_dispatch test builds still build + upload Windows artifacts.
  # Re-add the Windows entry to the tag branch below once Windows is validated.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo 'matrix={"include":[{"os":"macos-latest","args":"--mac --universal"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"macos-latest","args":"--mac --universal"},{"os":"windows-latest","args":"--win"}]}' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Tag (release) runs require approval via the protected 'release'
    # environment (a human must approve each publish - this is the gate that
    # keeps an unsigned auto-update build from shipping to clients without
    # sign-off). workflow_dispatch test builds get no environment, so on-demand
    # artifact builds stay friction-free.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    steps:
      # Third-party actions pinned to commit SHAs (not moveable tags) so a
      # compromised/retargeted tag cannot inject into the release pipeline.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # Code signing is DORMANT until the certificate secrets are added. This
      # step writes CSC_LINK to the env ONLY when the per-OS cert secret is
      # actually present, so an absent secret leaves CSC_LINK *unset* and
      # electron-builder skips signing (today's unsigned build). A
      # defined-but-empty CSC_LINK must be avoided - electron-builder treats it
      # as a real certificate path and the build fails. See docs/signing-setup.md.
      - name: Configure code signing
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          write_env() { printf '%s<<__GHEOF__\n%s\n__GHEOF__\n' "$1" "$2" >> "$GITHUB_ENV"; }
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ -n "$MAC_CSC_LINK" ]; then
            write_env CSC_LINK "$MAC_CSC_LINK"
            write_env CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD"
            write_env APPLE_ID "$APPLE_ID"
            write_env APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD"
            write_env APPLE_TEAM_ID "$APPLE_TEAM_ID"
            echo "macOS code signing: ENABLED"
          elif [ "${{ matrix.os }}" = "windows-latest" ] && [ -n "$WIN_CSC_LINK" ]; then
            write_env CSC_LINK "$WIN_CSC_LINK"
            write_env CSC_KEY_PASSWORD "$WIN_CSC_KEY_PASSWORD"
            echo "Windows code signing: ENABLED"
          else
            echo "Code signing DORMANT (no certificate secret present) - unsigned build"
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Always build WITHOUT electron-builder publishing. Its own GitHub
      # publisher (--publish always) raced to create the release and produced
      # duplicate / partial releases (bit v0.6.0 and v0.6.1). We build the
      # artifacts here and publish them deterministically with gh below.
      - name: Build (no publish)
        run: npx electron-builder ${{ matrix.args }} --publish never
      # Guard: refuse to publish a release without its auto-update manifest, so
      # a bad build can never ship a release that breaks or stalls auto-update
      # (exactly the broken-partial-release failure mode we just cleaned up).
      - name: Verify update manifest (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          shopt -s nullglob
          ymls=(dist/latest*.yml)
          if [ ${#ymls[@]} -eq 0 ]; then
            echo "::error::No latest*.yml update manifest in dist/; refusing to publish."
            ls -la dist || true
            exit 1
          fi
      # Deterministic publish: exactly one release object per tag, uploaded in a
      # single sequential step. Idempotent on re-run (create-if-absent + clobber),
      # so there is no create race and re-runs never duplicate a release.
      # NOTE: tag builds are macOS-only today (see the setup matrix). If Windows
      # is later un-gated so two build jobs run in parallel, move this into a
      # dedicated publish job (needs: build) to keep a single release writer.
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes "Automated release $TAG. Release notes pending."
          fi
          shopt -s nullglob
          assets=(dist/*.dmg dist/*.zip dist/*.exe dist/*.blockmap dist/latest*.yml)
          echo "Uploading ${#assets[@]} assets to $TAG:"
          printf '  %s\n' "${assets[@]}"
          gh release upload "$TAG" "${assets[@]}" --clobber
      - name: Upload artifacts (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nowtify-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: ignore
