name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # on-demand test build (artifacts only, no publish)

permissions:
  contents: write          # needed to publish GitHub Releases

jobs:
  # Build both platforms. macOS (universal) + Windows (nsis). Runs for tag
  # pushes (release) and workflow_dispatch (downloadable test artifacts).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --universal
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      # Third-party actions pinned to commit SHAs (not moveable tags) so a
      # compromised/retargeted tag cannot inject into the release pipeline.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # Code signing is DORMANT until the certificate secrets are added. This
      # step writes CSC_LINK to the env ONLY when the per-OS cert secret is
      # actually present, so an absent secret leaves CSC_LINK *unset* and
      # electron-builder skips signing (today's unsigned build). A
      # defined-but-empty CSC_LINK must be avoided - electron-builder treats it
      # as a real certificate path and the build fails. See docs/signing-setup.md.
      - name: Configure code signing
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          write_env() { printf '%s<<__GHEOF__\n%s\n__GHEOF__\n' "$1" "$2" >> "$GITHUB_ENV"; }
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ -n "$MAC_CSC_LINK" ]; then
            write_env CSC_LINK "$MAC_CSC_LINK"
            write_env CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD"
            write_env APPLE_ID "$APPLE_ID"
            write_env APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD"
            write_env APPLE_TEAM_ID "$APPLE_TEAM_ID"
            echo "macOS code signing: ENABLED"
          elif [ "${{ matrix.os }}" = "windows-latest" ] && [ -n "$WIN_CSC_LINK" ]; then
            write_env CSC_LINK "$WIN_CSC_LINK"
            write_env CSC_KEY_PASSWORD "$WIN_CSC_KEY_PASSWORD"
            echo "Windows code signing: ENABLED"
          else
            echo "Code signing DORMANT (no certificate secret present) - unsigned build"
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Always build WITHOUT electron-builder publishing. Its own GitHub
      # publisher (--publish always) raced to create the release and produced
      # duplicate / partial releases (bit v0.6.0 and v0.6.1). We build here and
      # a single downstream job publishes deterministically with gh.
      - name: Build (no publish)
        run: npx electron-builder ${{ matrix.args }} --publish never
      # Upload every build output so the single publish job can attach them.
      # Runs for tag AND dispatch builds (dispatch = a downloadable test build).
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nowtify-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: ignore

  # SINGLE publish job = one release writer, so the parallel macOS + Windows
  # build jobs can never race to create the release (the electron-builder
  # failure mode we hit on v0.6.0/v0.6.1). But platform FAILURES are DECOUPLED:
  # this ships whatever platform(s) actually built. A broken Windows build does
  # not block the macOS release (and vice versa) - it just publishes without the
  # missing platform and warns. Re-running after a fix attaches the missing
  # platform to the same release (--clobber). `!cancelled()` so it still runs
  # when one build leg failed; the build matrix is fail-fast:false so the other
  # leg finishes. The 'release' environment gate is the human sign-off before
  # users get the update.
  publish:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download whatever platform artifacts built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `|| true`: with decoupled platforms, one may have produced no
        # artifacts. Missing-platform handling is done in the publish step.
        run: gh run download "${{ github.run_id }}" -R "${{ github.repository }}" --dir artifacts || true
      - name: Publish single GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Ship the platforms that built. Require AT LEAST ONE update manifest;
          # warn (do not block) on a missing platform so one broken build never
          # holds the other platform's release hostage.
          macyml=$(find artifacts -type f -name 'latest-mac.yml' 2>/dev/null | head -1)
          winyml=$(find artifacts -type f -name 'latest.yml' 2>/dev/null | head -1)
          if [ -z "$macyml" ] && [ -z "$winyml" ]; then
            echo "::error::No platform built successfully; nothing to publish."
            find artifacts -type f 2>/dev/null | sort || true
            exit 1
          fi
          [ -z "$macyml" ] && echo "::warning::macOS artifacts missing - publishing WITHOUT macOS."
          [ -z "$winyml" ] && echo "::warning::Windows artifacts missing - publishing WITHOUT Windows."
          # Create the release exactly once (idempotent on re-run).
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes "Automated release $TAG. Release notes pending."
          fi
          # Upload the installers + blockmaps + update manifests that exist,
          # clobbering so re-runs (e.g. after fixing a platform) are idempotent.
          mapfile -t assets < <(find artifacts -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \
            -o -name '*.blockmap' -o -name 'latest*.yml' \))
          echo "Uploading ${#assets[@]} assets to $TAG:"
          printf '  %s\n' "${assets[@]}"
          gh release upload "$TAG" "${assets[@]}" -R "$GITHUB_REPOSITORY" --clobber
